services:
  db:
    image: mysql:8.0
    container_name: final-project-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: final_project
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: final-project-app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:root@db:3306/final_project
      JWT_SECRET: dev-jwt-secret
      PORT: 5000
      # Prefer .ts over stale co-located .js when running ts-node (avoids old workflowController.js).
      TS_NODE_PREFER_TS_EXTS: "1"
      AI_PROVIDER: huggingface
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      HUGGINGFACE_MODEL: Qwen/Qwen2.5-7B-Instruct
      FIT_SCORE_MODEL_BUNDLE: /app/fit_score_model_bundle.zip
      FIT_SCORE_MODEL_DIR: /app/model_assets
      PYTHON_EXECUTABLE: /opt/ml-venv/bin/python
    ports:
      - "5000:5000"
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npx ts-node src/server.ts"

  frontend:
    image: python:3.11-alpine
    container_name: final-project-frontend
    restart: unless-stopped
    working_dir: /frontend
    ports:
      - "5501:5501"
    volumes:
      - ../frontend_son:/frontend:ro
    command: sh -c "python3 -m http.server 5501"

volumes:
  mysql_data:
  app_node_modules:
